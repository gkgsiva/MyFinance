name: Web app

# Tests and builds the iPhone web app (web/). The app is hosted on Heroku (see web/README.md), which builds it
# itself. Publishing on GitHub Pages as well is optional: set the Actions variable PAGES_DEPLOY to "true".
# Only the app's code is ever published: statements and their contents are never part of the site.
on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', 'Procfile', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'package.json', 'Procfile', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY == 'true'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
