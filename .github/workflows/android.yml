name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0 (creates tag v1.0 with the APK attached)"
        required: true

permissions:
  contents: write

env:
  APP_VERSION: ${{ inputs.version || format('0.0.{0}', github.run_number) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # services.gradle.org is occasionally slow or returns 5xx; retry the one-time wrapper download.
      - name: Fetch Gradle
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "myfinance-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: myfinance-debug-apk
          path: myfinance-*.apk
      # Run this workflow manually (Actions > Build APK > Run workflow) with a version to publish a release.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION}" myfinance-*.apk \
            --target "${{ github.sha }}" \
            --title "MyFinance ${APP_VERSION}" \
            --notes "Install: download the .apk below on your phone and open it (allow installing unknown apps). It installs over an earlier version and keeps your data."
