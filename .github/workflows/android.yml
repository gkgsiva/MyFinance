name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # services.gradle.org is occasionally slow or returns 5xx; retry the one-time wrapper download.
      - name: Fetch Gradle
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "myfinance-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: myfinance-debug-apk
          path: myfinance-*.apk
      # Every build of main (or a manual run) becomes a GitHub Release with the APK attached.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" myfinance-*.apk \
            --target "${{ github.sha }}" \
            --title "MyFinance 0.1.${{ github.run_number }}" \
            --notes "Install: download the .apk below on your phone and open it (allow installing unknown apps). It installs over an earlier version and keeps your data."
